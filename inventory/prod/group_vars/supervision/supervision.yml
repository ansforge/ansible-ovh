---
# ─────────────────────────────────────────────────────────────────────────────
# Configuration spécifique à la supervision
#
# Groupe concerné :
#   - infra-prod-sup01
#
# Cette VM appartient également au groupe [alma10].
#
# Elle utilise :
#   - les dépôts AlmaLinux locaux
#   - le dépôt Grafana externe
#   - le dépôt InfluxData externe
#
# Les dépôts externes sont consommés via le proxy Squid.
# ─────────────────────────────────────────────────────────────────────────────

repositories:

  # ---------------------------------------------------------------------------
  # AlmaLinux BaseOS
  # ---------------------------------------------------------------------------

  - name: alma10-local-baseos
    description: "AlmaLinux 10 - Local BaseOS"
    baseurl: "http://{{ repo_server_fqdn }}/{{ repo_http_alias }}/{{ alma_repos.0 }}/"

  # ---------------------------------------------------------------------------
  # AlmaLinux AppStream
  # ---------------------------------------------------------------------------

  - name: alma10-local-appstream
    description: "AlmaLinux 10 - Local AppStream"
    baseurl: "http://{{ repo_server_fqdn }}/{{ repo_http_alias }}/{{ alma_repos.1 }}/"

  # ---------------------------------------------------------------------------
  # AlmaLinux Extras
  # ---------------------------------------------------------------------------

  - name: alma10-local-extras
    description: "AlmaLinux 10 - Local Extras"
    baseurl: "http://{{ repo_server_fqdn }}/{{ repo_http_alias }}/{{ alma_repos.2 }}/"

  # ---------------------------------------------------------------------------
  # Grafana
  #
  # Arborescence PLATE :
  # ne pas ajouter $releasever/$basearch.
  # ---------------------------------------------------------------------------

  - name: grafana
    description: "Grafana OSS"
    baseurl: "https://rpm.grafana.com"
    gpgkey: "https://rpm.grafana.com/gpg.key"
    gpgcheck: true
    repo_gpgcheck: true
    proxy: "{{ proxy_url }}"

  # ---------------------------------------------------------------------------
  # InfluxData
  # ---------------------------------------------------------------------------

  - name: influxdata
    description: "InfluxData - InfluxDB 2 & Telegraf"
    baseurl: "https://repos.influxdata.com/rhel/$releasever/$basearch/stable"
    gpgkey: "https://repos.influxdata.com/influxdata-archive.key"
    gpgcheck: true
    repo_gpgcheck: false
    proxy: "{{ proxy_url }}"

# Clé GPG AlmaLinux locale
gpgkey: "file:///etc/pki/rpm-gpg/RPM-GPG-KEY-AlmaLinux-{{ ansible_distribution_major_version }}"
