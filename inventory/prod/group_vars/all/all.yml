---
main_domain: "ans.local"
repo_server_fqdn: "infra-prod-repo01.{{ main_domain }}"

ntpservers:
  - ntp.ovh.net

allowednets:
  - '10.11.90.0/24'
  - '10.11.52.0/24'
  - '10.11.30.0/24'
  - '10.11.70.0/24'

repo_server_ip: "{{ hostvars[groups['repo'][0]]['ansible_host'] }}"
proxy_port: 3128
proxy_url: "http://{{ hostvars[groups['proxy'][0]]['ansible_host'] }}:{{ proxy_port }}"

proxy_no_proxy: "localhost,127.0.0.1,{{ repo_server_ip }},{{ repo_server_fqdn }},.{{ main_domain }}"
no_proxy: "{{ proxy_no_proxy }}"

proxy_env:
  http_proxy: "{{ proxy_url }}"
  https_proxy: "{{ proxy_url }}"
  HTTP_PROXY: "{{ proxy_url }}"
  HTTPS_PROXY: "{{ proxy_url }}"
  no_proxy: "{{ proxy_no_proxy }}"
  NO_PROXY: "{{ proxy_no_proxy }}"

alma_repos:
  - baseos
  - appstream
  - extras

alma_releases:
  - "9"
  - "10"

repo_base_path: "/var/www/html/repos"

repo_http_alias_list:
  - "alma9-repos"
  - "alma10-repos"
