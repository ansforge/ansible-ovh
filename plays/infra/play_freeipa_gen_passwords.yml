---
- name: Générer / compléter vault_freeipa.yml avec des mots de passe FreeIPA
  hosts: localhost
  gather_facts: false
  connection: local

  vars_prompt:
    - name: vault_pass
      prompt: "Mot de passe du vault Ansible"
      private: yes

  vars:
    vault_file: "{{ lookup('env', 'HOME') }}/ansible-ovh/vaults/vault_freeipa.yml"
    vault_tmp_file: "{{ vault_file }}.tmp"
    vault_pass_file: "{{ lookup('env', 'HOME') }}/.vault_pass_tmp.txt"

    # Charger users_data.yaml comme données brutes (sans rendre les {{ ... }})
    users_data: "{{ lookup('file', 'users_data.yml') | from_yaml }}"
    ipa_users: "{{ users_data.ipa_users }}"

  tasks:
    - name: Créer le répertoire du vault s'il n'existe pas
      ansible.builtin.file:
        path: "{{ vault_file | dirname }}"
        state: directory
        mode: "0700"

    - name: Créer le fichier de mot de passe temporaire
      ansible.builtin.copy:
        dest: "{{ vault_pass_file }}"
        content: "{{ vault_pass }}"
        mode: "0600"

    - name: Vérifier si le vault existe déjà
      ansible.builtin.stat:
        path: "{{ vault_file }}"
      register: vault_stat

    - name: Déchiffrer le vault existant dans un fichier temporaire
      ansible.builtin.shell: |
        ansible-vault decrypt "{{ vault_file }}" \
          --output "{{ vault_tmp_file }}" \
          --vault-password-file "{{ vault_pass_file }}"
      args:
        executable: /bin/bash
      when: vault_stat.stat.exists
      delegate_to: localhost
      run_once: true

    - name: Créer un fichier temporaire vide si le vault n'existe pas
      ansible.builtin.copy:
        dest: "{{ vault_tmp_file }}"
        content: ""
        mode: "0600"
      when: not vault_stat.stat.exists
      delegate_to: localhost
      run_once: true

    - name: Ajouter les mots de passe manquants dans le fichier temporaire
      ansible.builtin.shell: |
        if grep -q "^vault_{{ item.name }}_password:" "{{ vault_tmp_file }}"; then
          echo "vault_{{ item.name }}_password existe déjà, pas de changement"
        else
          PASSWORD="$(openssl rand -base64 16)"
          echo "vault_{{ item.name }}_password: '${PASSWORD}'" >> "{{ vault_tmp_file }}"
        fi
      args:
        executable: /bin/bash
      loop: "{{ ipa_users }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      run_once: true

    - name: Chiffrer le fichier temporaire vers vault_freeipa.yml
      ansible.builtin.shell: |
        ansible-vault encrypt "{{ vault_tmp_file }}" \
          --output "{{ vault_file }}" \
          --vault-password-file "{{ vault_pass_file }}"
      args:
        executable: /bin/bash
      delegate_to: localhost
      run_once: true

    - name: Supprimer le fichier temporaire en clair
      ansible.builtin.file:
        path: "{{ vault_tmp_file }}"
        state: absent
      delegate_to: localhost
      run_once: true

    - name: Supprimer le fichier de mot de passe temporaire
      ansible.builtin.file:
        path: "{{ vault_pass_file }}"
        state: absent
      delegate_to: localhost
      run_once: true

