---
- name: Configuration serveur rebond SSH
  hosts: rebond
  become: yes

  tasks:
    - name: Installer utilitaires réseau
      ansible.builtin.dnf:
        name:
          - openssh-clients
          - fail2ban
        state: present

    - name: Activer fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: yes
        state: started

    - name: Sécuriser SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: restart sshd

  handlers:
    - name: restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted
