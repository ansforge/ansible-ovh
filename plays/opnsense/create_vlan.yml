---
- name: Creation VLAN et VIP CARP OPNsense
  hosts: opnsense
  gather_facts: false
  serial: 1

  vars:
    api_host: "{{ ansible_host }}"
    api_key: "{{ opn_api_key }}"
    api_secret: "{{ opn_api_secret }}"
    opn_ssl_verify: false
    opn_timeout: 30
    carp_password: "Si0TbNVUoQ6yQMIp0R7R"
    ssh_key: "/home/almalinux/.ssh/opnsense_key"
    ssh_opts: "-o ControlMaster=auto -o ControlPath=/tmp/ssh_{{ api_host }} -o ControlPersist=120s -o StrictHostKeyChecking=no"

  tasks:
    - name: "Ouverture connexion SSH multiplexée"
      ansible.builtin.shell:
        cmd: |
          ssh -i {{ ssh_key }} {{ ssh_opts }} root@{{ api_host }} "echo connected"
      changed_when: false

    - name: "Traitement de chaque VLAN"
      include_tasks: create_vlan_item.yml
      loop: "{{ vlans }}"
      loop_control:
        loop_var: vlan_item
        label: "{{ vlan_item.vlan_name }}_vlan{{ vlan_item.vlan_id }}"

    - name: "Fermeture connexion SSH multiplexée"
      ansible.builtin.shell:
        cmd: |
          ssh -i {{ ssh_key }} {{ ssh_opts }} -O exit root@{{ api_host }}
      changed_when: false
      ignore_errors: true
