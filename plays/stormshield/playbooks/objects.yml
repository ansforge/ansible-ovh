---
- hosts: sns_appliances
  gather_facts: no

  environment:
    no_proxy: "localhost,127.0.0.1,10.11.90.0/24,10.11.30.0/24,10.11.20.0/24"
    NO_PROXY: "localhost,127.0.0.1,10.11.90.0/24,10.11.30.0/24,10.11.20.0/24"

  vars_files:
    - ../vars/objects.yml

  tasks:
    - name: "Création des hosts"
      stormshield.sns.sns_command:
        appliance: "{{ appliance }}"
        force_modify: "{{ hostvars[inventory_hostname].force_modify | default(false) }}"
        script: |
          {% for host in sns_hosts %}
          CONFIG OBJECT HOST NEW name={{ host.name }} ip={{ host.ip }} comment="{{ host.comment | default('') }}"
          {% endfor %}
          CONFIG OBJECT ACTIVATE
