---
- hosts: sns_appliances
  gather_facts: no
  vars_files:
    - ../vars/matrice_de_flux.yml

  tasks:
    - name: "Création des hosts"
      stormshield.sns.sns_command:
        appliance: "{{ appliance }}"
        force_modify: "{{ hostvars[inventory_hostname].force_modify | default(false) }}"
        script: |
          {% for h in objets.hosts | default([]) %}
          CONFIG OBJECT HOST NEW update=1 name={{ h.name }} ip={{ h.ip }} comment="{{ h.comment }}"
          {% endfor %}
          CONFIG OBJECT ACTIVATE
      failed_when: false
      when: objets.hosts | default([]) | length > 0

    - name: "Création des networks"
      stormshield.sns.sns_command:
        appliance: "{{ appliance }}"
        force_modify: "{{ hostvars[inventory_hostname].force_modify | default(false) }}"
        script: |
          {% for n in objets.networks | default([]) %}
          CONFIG OBJECT NETWORK NEW update=1 name={{ n.name }} ip={{ n.ip }} mask={{ n.mask }} comment="{{ n.comment }}"
          {% endfor %}
          CONFIG OBJECT ACTIVATE
      failed_when: false
      when: objets.networks | default([]) | length > 0

    - name: "Création des groupes"
      stormshield.sns.sns_command:
        appliance: "{{ appliance }}"
        force_modify: "{{ hostvars[inventory_hostname].force_modify | default(false) }}"
        script: |
          {% for g in objets.groupes | default([]) %}
          CONFIG OBJECT GROUP NEW update=1 name={{ g.name }}
          {% for m in g.members %}
          CONFIG OBJECT GROUP ADDTO group={{ g.name }} node={{ m }}
          {% endfor %}
          {% endfor %}
          CONFIG OBJECT ACTIVATE
      failed_when: false
      when: objets.groupes | default([]) | length > 0

    - name: "Création des services"
      stormshield.sns.sns_command:
        appliance: "{{ appliance }}"
        force_modify: "{{ hostvars[inventory_hostname].force_modify | default(false) }}"
        script: |
          {% for s in services | default([]) %}
          CONFIG OBJECT SERVICE NEW update=1 name={{ s.name }} proto={{ s.proto }} port={{ s.port }}
          {% endfor %}
          CONFIG OBJECT ACTIVATE
      failed_when: false
      when: services | default([]) | length > 0

    - name: "Déploiement règles filter et NAT"
      include_role:
        name: stormshield.sns.sns_policy
      vars:
        slot: 1
        mode: add
        activate: yes
        filter: "{{ flux_filter | default([]) }}"
        nat: "{{ flux_nat | default([]) }}"
