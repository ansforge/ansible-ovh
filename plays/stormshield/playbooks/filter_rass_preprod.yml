---
- hosts: sns_appliances
  gather_facts: no
  vars:
    sns_filter_slot: 1
  vars_files:
    - ../vars/filter_rass_preprod.yml

  pre_tasks:
    - name: "Créer séparateur rass_preprod (filter)"
      stormshield.sns.sns_command:
        appliance: "{{ appliance }}"
        script: |
          CONFIG FILTER RULE ADDSEP index={{ sns_filter_slot }} type=filter color=c0c0c0 comment=rass_preprod collapse=0

  roles:
    - role: stormshield.sns.sns_policy
      slot: "{{ sns_filter_slot }}"
      mode: add
      activate: yes
      filter: "{{ sns_filter_rules_rass_preprod }}"
