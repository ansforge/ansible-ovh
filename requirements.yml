---
# Collections Ansible requises (chemin ./collections, cf. ansible.cfg) :
#   ansible-galaxy collection install -r requirements.yml -p collections
# Bornes compatibles ansible-core 2.14 (AlmaLinux 9) à 2.18.
collections:
  - name: freeipa.ansible_freeipa      # enrôlement IPA (ipaclient), enregistrements DNS (ipadnsrecord)
    version: ">=1.9.0"
  - name: ansible.posix                # authorized_key (role_copy_ssh_key), callback profile_tasks
    version: ">=1.4.0"
  - name: community.general            # nmcli (role_network_interfaces)
    version: ">=8.0.0,<10.0.0"
