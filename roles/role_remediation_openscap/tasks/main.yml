---
# tasks file for remediation-openscap
- name: Ensure remediation reports directory exists
  ansible.builtin.file:
    path: "{{ openscap_remediation_path }}" 
    state: directory
    mode: "0755"

- name: Execute OpenSCAP remediation
  ansible.builtin.command:
    cmd: >
      oscap xccdf eval
      --remediate
      --profile {{ openscap_remediation_profile }}
      --results {{ openscap_remediation_results }} 
      --report {{ openscap_remediation_report }}
      --fetch-remote-resources
      /usr/share/xml/scap/ssg/content/ssg-almalinux{{ ansible_distribution_major_version | default('9') }}-ds.xml
  register: oscap_remediation
  failed_when: oscap_remediation.rc not in [0, 2] # 0 = Compliant, 2 = Non-compliant but command succeeded
  changed_when: true

- name: Fetch OpenSCAP HTML remediation report to local machine
  ansible.builtin.fetch:
    src: "{{ openscap_remediation_report }}"
    dest: "{{ playbook_dir }}/../../reports/{{ inventory_hostname }}/"
    flat: yes
