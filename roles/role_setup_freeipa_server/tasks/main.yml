---
- name: Configure /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ ipa_server_ip }} {{ ipa_server_fqdn }} {{ ipa_server_fqdn | split('.') | first }}"
    state: present

- name: Set FQDN hostname
  ansible.builtin.hostname:
    name: "{{ ipa_server_fqdn }}"

- name: Install FreeIPA Server
  ansible.builtin.include_role:
    name: freeipa.ansible_freeipa.ipaserver
  vars:
    ipaadmin_password: "{{ freeipa_admin_password }}"
    ipadm_password: "{{ vault_ipadm_password | default(omit) }}"

- name: Create Reverse Zones
  freeipa.ansible_freeipa.ipadnszone:
    ipaadmin_password: "{{ freeipa_admin_password }}"
    ipaadmin_principal: "{{ freeipa_admin_principal }}@{{ freeipa_realm }}"
    name: "{{ item }}"
    state: present
  loop: "{{ ipa_reverse_zones }}"

- name: Créer les utilisateurs dans FreeIPA
  freeipa.ansible_freeipa.ipauser:
    ipaadmin_principal: "{{ freeipa_admin_principal }}@{{ freeipa_realm }}"
    ipaadmin_password: "{{ freeipa_admin_password }}"
    name: "{{ item.name }}"
    first: "{{ item.first | default(item.name) }}"
    last: "{{ item.last | default('User') }}"
    state: present
    password: "{{ item.password }}"
    update_password: on_create
  loop: "{{ freeipa_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
