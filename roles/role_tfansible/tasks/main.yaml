---
- name: Installer dnf-plugins-core (nécessaire pour config-manager)
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Installer Ansible (ansible-core)
  ansible.builtin.dnf:
    name: ansible-core
    state: present

- name: Ajouter dépôt HashiCorp
  ansible.builtin.command: >
    dnf config-manager --add-repo https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo
  args:
    creates: /etc/yum.repos.d/hashicorp.repo

- name: Installer Terraform
  ansible.builtin.dnf:
    name: terraform
    state: present
