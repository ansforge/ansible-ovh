
---
repo_base_path: /var/www/html/repos
repo_mount_path: /var/www/html/repos
repo_disk_device: /dev/sdb

proxy_ip: "{{ hostvars[groups['proxy'][0]]['ansible_host'] }}"
proxy_port: 3128

# Liste des dépôts à synchroniser
alma_repos:
  - baseos
  - appstream
  - extras
# liste des version d os a synchroniser
alma_releases:
  - "10"
# liste des alias/repertoires correspondants
repo_http_alias_list:
 - alma10-repos

# Réseaux autorisés (VLANs)
allowed_networks:
  - 10.16.90.0/24
  - 10.16.90.0/24
